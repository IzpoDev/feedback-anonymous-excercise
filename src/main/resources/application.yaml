server:
  port: 8082

spring:
  application:
    name: feedback
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${URL_DB}
    username: ${USER_DB}
    password: ${PASSWORD_DB}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}

resend:
  api:
    key: ${RESEND_API_KEY}
web:
  origin: ${URL_ORIGIN}